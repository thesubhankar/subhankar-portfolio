name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes (cron syntax)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Endpoint
        run: |
          curl -fsSL https://thesubhankarx.onrender.com/api/ping || echo "Ping failed"
